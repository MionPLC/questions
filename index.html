<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MionPLC</title>

<style>
body{
    margin:0;
    font-family:Arial;
    display:flex;
    background:#f5f7fa;
}

/* sidebar */
.sidebar{
    width:250px;
    background:#fff;
    height:100vh;
    padding:20px;
    border-right:1px solid #ddd;
    position:fixed;
}

.sidebar a{
    display:block;
    text-decoration:none;
    color:#444;
    margin:8px 0;
}

/* content */
.content{
    margin-left:270px;
    padding:20px;
    width:100%;
}

/* nav */
.nav-bottom{
    display:flex;
    justify-content:space-between;
    margin-top:30px;
}

.nav-bottom a{
    background:#334155;
    color:#fff;
    padding:10px 15px;
    border-radius:10px;
    text-decoration:none;
}

.nav-bottom a.disabled{
    background:#94a3b8;
    pointer-events:none;
}

/* tag */
.tag-group{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
}

.tag-group code{
    background:#eee;
    padding:4px 8px;
}

/* iframe */
.iframe-container{
    width:100%;
    max-width:1280px;
    aspect-ratio:16/9;
    position:relative;
}

iframe{
    position:absolute;
    top:50%;
    left:50%;
    width:1280px;
    height:720px;
    transform:translate(-50%,-50%) scale(0.7);
    border:none;
}
</style>
</head>

<body>

<div class="sidebar">
    <h3>Question</h3>
    <a href="#overview">Ringkasan</a>
    <a href="#addressing">Pengalamatan</a>
    <a href="#simulasi">Simulasi</a>
</div>

<div class="content">

<h1 id="title">Loading...</h1>

<section id="overview">
<p id="overview-text"></p>
</section>

<section id="addressing">
<h2>Pengalamatan</h2>

<p>Input</p>
<div id="input-list" class="tag-group"></div>

<p>Output</p>
<div id="output-list" class="tag-group"></div>
</section>

<section id="simulasi">
<h2>Simulasi</h2>
<div class="iframe-container">
<iframe id="sim-frame"></iframe>
</div>
</section>

<div class="nav-bottom">
<a id="prev-btn">←</a>
<a href="/" style="background:#0ea5e9">Home</a>
<a id="next-btn">→</a>
</div>

</div>

<script>
let allQuestions = {};
let keys = [];
let currentIndex = 0;

// ambil ?q=
function getQuestionId(){
    const params = new URLSearchParams(location.search);
    return params.get("q") || "question1";
}

// render
function render(id){
    const data = allQuestions[id];
    if(!data) return;

    currentIndex = keys.indexOf(id);

    title.innerText = data.title;
    overview-text.innerText = data.overview;

    input-list.innerHTML = "";
    data.input.forEach(i=>{
        input-list.innerHTML += `<code>${i.address} | ${i.label}</code>`;
    });

    output-list.innerHTML = "";
    data.output.forEach(o=>{
        output-list.innerHTML += `<code>${o.address} | ${o.label}</code>`;
    });

    sim-frame.src = data.iframe;

    updateNav();

    // scroll ke atas
    window.scrollTo({top:0,behavior:"smooth"});

    // scroll ke section jika ada hash
    if(location.hash){
        const el = document.querySelector(location.hash);
        if(el){
            setTimeout(()=>{
                el.scrollIntoView({behavior:"smooth"});
            },100);
        }
    }
}

// navigation
function updateNav(){
    prev-btn.classList.toggle("disabled", currentIndex===0);
    next-btn.classList.toggle("disabled", currentIndex===keys.length-1);
}

prev-btn.onclick = ()=>{
    if(currentIndex>0){
        location.search = "?q="+keys[currentIndex-1];
    }
};

next-btn.onclick = ()=>{
    if(currentIndex<keys.length-1){
        location.search = "?q="+keys[currentIndex+1];
    }
};

// init
async function init(){
    const res = await fetch("questions.json");
    allQuestions = await res.json();
    keys = Object.keys(allQuestions);

    render(getQuestionId());
}

window.onload = init;
</script>

</body>
</html>
