<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page</title>

<style>

html, body {
  margin: 0;
  height: 720px;
  width: 1280px;

  display: flex;
  justify-content: center;
  align-items: center;

  background: repeating-linear-gradient(
    45deg,
    #000 0px,
    #000 15px,
    #ffcc00 15px,
    #ffcc00 30px
  );
}

/* canvas */
.canvas {
  width: calc(100% - 40px);
  height: calc(100% - 40px);
  background: #222;
  display: flex;
}

/* canvas kiri */
.left {
  width: 70%;
  background: #444;
}

/* canvas kanan */
.right {
  width: 30%;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 10px;
}

/* tabel konfig */
.panel {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column; /* ini bikin tabel ke bawah */
  gap: 10px; /* jarak antar tabel */
  cursor: pointer;
}

/* scroll */
.table-wrapper {
  flex: 1; /* bagi tinggi sama rata */
  overflow-y: auto;
  overflow-x: hidden;
}

/* scrollbar */
.table-wrapper::-webkit-scrollbar {
  width: 6px;
}
.table-wrapper::-webkit-scrollbar-thumb {
  background: whitesmoke;
  border-radius: 10px;
}

/* desain tabel */
.tabel {
  width: 100%;
  border-collapse: collapse;
  font-size: 16px;
  color: whitesmoke;
  table-layout: fixed;
}

.tabel td {
  border: 2px solid whitesmoke;
  padding: 6px;
}

/* judul */
.judul {
  text-align: center;
  font-size: 18px;
  font-weight: bold;
}

/* header */
.tabel tr:first-child td {
  position: sticky;
  top: 0;
  background: #222;
  z-index: 2;
}

/* tabel kiri */
.left-text {
  text-align: left;
  word-wrap: break-word;
  overflow-wrap: break-word;
}

/* tabel kanan */
.center-text {
  text-align: center;
}

/* warna */
.tabel tr:nth-child(even):not(:first-child) {
  background: #333;
}
</style>
</head>

<body>

<div class="canvas">
  
  <div class="left"></div>

  <div class="right">
    <div class="panel">

      <!-- input -->
      <div class="table-wrapper">
        <table class="tabel">
          <tr>
            <td colspan="2" class="judul">INPUT</td>
          </tr>

          <tr><td class="left-text">Tombol</td><td class="center-text">0</td></tr>
          <tr><td class="left-text">-</td><td class="center-text">-</td></tr>
          <tr><td class="left-text">-</td><td class="center-text">-</td></tr>
          <tr><td class="left-text">-</td><td class="center-text">-</td></tr>
          <tr><td class="left-text">-</td><td class="center-text">-</td></tr>
          <tr><td class="left-text">-</td><td class="center-text">-</td></tr>
          <tr><td class="left-text">-</td><td class="center-text">-</td></tr>
          <tr><td class="left-text">-</td><td class="center-text">-</td></tr>
          <tr><td class="left-text">-</td><td class="center-text">-</td></tr>
          <tr><td class="left-text">-</td><td class="center-text">-</td></tr>
        </table>
      </div>

      <!-- output -->
      <div class="table-wrapper">
        <table class="tabel">
          <tr>
            <td colspan="2" class="judul">OUTPUT</td>
          </tr>

          <tr><td class="left-text">Lampu</td><td class="center-text">0</td></tr>
          <tr><td class="left-text">-</td><td class="center-text">-</td></tr>
          <tr><td class="left-text">-</td><td class="center-text">-</td></tr>
          <tr><td class="left-text">-</td><td class="center-text">-</td></tr>
          <tr><td class="left-text">-</td><td class="center-text">-</td></tr>
          <tr><td class="left-text">-</td><td class="center-text">-</td></tr>
          <tr><td class="left-text">-</td><td class="center-text">-</td></tr>
          <tr><td class="left-text">-</td><td class="center-text">-</td></tr>
          <tr><td class="left-text">-</td><td class="center-text">-</td></tr>
          <tr><td class="left-text">-</td><td class="center-text">-</td></tr>
        </table>
      </div>

    </div>
  </div>

</div>

</body>
</html>
