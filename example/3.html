<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PLC Multi-Touch Panel</title>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: #222;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
}

.wrapper {
  width: 1280px;
  height: 720px;
}

.frame {
  width: 100%;
  height: 100%;
  padding: 20px;
  background: repeating-linear-gradient(
    45deg,
    #000 0px,
    #000 15px,
    #ffcc00 15px,
    #ffcc00 30px
  );
  display: flex;
}

.container {
  width: 100%;
  height: 100%;
  background: #333;
  border-radius: 12px;
  display: flex;
  overflow: hidden;
  color: white;
}

/* LEFT */
.left {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: center;
  padding: 20px;
}

/* BUTTON GROUP */
.button-group {
  display: flex;
  gap: 20px;
}

/* BUTTON */
button {
  width: 180px;
  height: 70px;
  font-size: 18px;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  background: #555;
}

/* ACTIVE STATE */
button.active {
  background: limegreen;
}

/* RIGHT */
.right {
  width: 300px;
  background: #222;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 15px;
}

/* LAMP */
.lamp-area {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}

.lamp {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  background: #666;
  box-shadow: inset 0 0 10px #000;
}

.lamp.on {
  background: limegreen;
  box-shadow: 0 0 20px limegreen, inset 0 0 10px #000;
}

/* TABLE */
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 16px;
}

td {
  border: 1px solid #555;
  padding: 10px;
}
</style>
</head>

<body>

<div class="wrapper">
  <div class="frame">
    <div class="container">

      <!-- LEFT -->
      <div class="left">

        <div class="lamp-area">
          <div class="lamp" id="lamp"></div>
          <div>Lampu</div>
        </div>

        <div class="button-group">
          <button id="btnOn">START</button>
          <button id="btnOff">STOP</button>
        </div>

      </div>

      <!-- RIGHT -->
      <div class="right">
        <table>
          <tr>
            <td>Input START</td>
            <td id="valOn">0</td>
          </tr>
          <tr>
            <td>Input STOP</td>
            <td id="valOff">0</td>
          </tr>
          <tr>
            <td>Output Lamp</td>
            <td id="valLamp">0</td>
          </tr>
        </table>
      </div>

    </div>
  </div>
</div>

<script>
const btnOn = document.getElementById("btnOn");
const btnOff = document.getElementById("btnOff");
const lamp = document.getElementById("lamp");

const valOn = document.getElementById("valOn");
const valOff = document.getElementById("valOff");
const valLamp = document.getElementById("valLamp");

let start = 0;
let stop = 0;
let lampState = 0;

/* LOGIC */
function logic() {
  if (start === 1) {
    lampState = 1; // PRIORITAS START
  } else if (stop === 1) {
    lampState = 0;
  }

  lamp.classList.toggle("on", lampState === 1);
  valLamp.textContent = lampState;
}

/* START */
function startDown() {
  start = 1;
  valOn.textContent = "1";
  btnOn.classList.add("active");
  logic();
}

function startUp() {
  start = 0;
  valOn.textContent = "0";
  btnOn.classList.remove("active");
}

/* STOP */
function stopDown() {
  stop = 1;
  valOff.textContent = "1";
  btnOff.classList.add("active");
  logic();
}

function stopUp() {
  stop = 0;
  valOff.textContent = "0";
  btnOff.classList.remove("active");
}

/* MOUSE EVENTS */
btnOn.addEventListener("mousedown", startDown);
btnOn.addEventListener("mouseup", startUp);
btnOn.addEventListener("mouseleave", startUp);

btnOff.addEventListener("mousedown", stopDown);
btnOff.addEventListener("mouseup", stopUp);
btnOff.addEventListener("mouseleave", stopUp);

/* TOUCH EVENTS (multi-touch support) */
btnOn.addEventListener("touchstart", (e) => { e.preventDefault(); startDown(); });
btnOn.addEventListener("touchend", startUp);

btnOff.addEventListener("touchstart", (e) => { e.preventDefault(); stopDown(); });
btnOff.addEventListener("touchend", stopUp);
</script>

<script>
function scalePanel() {
  const baseW = 1280;
  const baseH = 720;

  const scaleX = window.innerWidth / baseW;
  const scaleY = window.innerHeight / baseH;

  const scale = Math.min(scaleX, scaleY);

  document.body.style.transform = `scale(${scale})`;
}

window.addEventListener("resize", scalePanel);
window.addEventListener("load", scalePanel);
</script>

</body>
</html>
