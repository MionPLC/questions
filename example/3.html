<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page</title>

<style>

html, body {
  margin: 0;
  height: 720px;
  width: 1280px;

  display: flex;
  justify-content: center;
  align-items: center;

  background: repeating-linear-gradient(
    45deg,
    #000 0px,
    #000 15px,
    #ffcc00 15px,
    #ffcc00 30px
  );
}

/* canvas */
.canvas {
  width: calc(100% - 40px);
  height: calc(100% - 40px);
  background: #222;
  display: flex;
}

/* canvas kiri */
.left {
  width: 70%;
  background: #444;
  display: flex;
  align-items: center;
  flex-direction: column;
}

.left .lamp {
  margin-top: 80px;
  width: 200px;
  height: 200px;
  border-radius: 100%;
  background: #666;
  box-shadow: 0px 0px 10px gray;
}

.left .buttonArea {
  display: flex;
  align-items: center;
  width: 100%;
  height: 100%-280px;
}

.buttonArea1, .buttonArea2 {
  width: 50%;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.button1, .button2 {
  margin-top: 150px;
  width: 270px;
  height: 90px;
  border-radius: 20px;
  background: #666;
  box-shadow: 0px 10px 10px gray;
  cursor: pointer;
  transition: all 0.1s ease;
}

.left p {
  font-size: 25px;
  color: whitesmoke;
  opacity: 60%;
  text-shadow: 0px 0px 10px gray;
}

/* canvas kanan */
.right {
  width: 30%;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 10px;
}

/* tabel konfig */
.panel {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  gap: 10px;
  cursor: pointer;
}

/* scroll */
.table-wrapper {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
}

/* scrollbar */
.table-wrapper::-webkit-scrollbar {
  width: 6px;
}
.table-wrapper::-webkit-scrollbar-thumb {
  background: whitesmoke;
  border-radius: 10px;
}

/* desain tabel */
.tabel {
  width: 100%;
  border-collapse: collapse;
  font-size: 16px;
  color: whitesmoke;
  table-layout: fixed;
}

.tabel td {
  border: 2px solid whitesmoke;
  padding: 6px;
}

/* judul */
.judul {
  text-align: center;
  font-size: 18px;
  font-weight: bold;
}

/* header */
.tabel tr:first-child td {
  position: sticky;
  top: 0;
  background: #222;
  z-index: 2;
}

/* tabel kiri */
.left-text {
  text-align: left;
  word-wrap: break-word;
  overflow-wrap: break-word;
}

/* tabel kanan */
.center-text {
  text-align: center;
}

/* warna */
.tabel tr:nth-child(even):not(:first-child) {
  background: #333;
}
</style>
</head>

<body>

<div class="canvas">
  
  <div class="left">
    <div class="lamp"></div>
    <p>Lampu</p>
    <div class="buttonArea">
      <div class="buttonArea1">
        <div class="button1"></div>
        <p>Start</p>
      </div>
      <div class="buttonArea2">
        <div class="button2"></div>
        <p>Stop</p>
      </div>
    </div>
  </div>

  <div class="right">
    <div class="panel">

      <!-- input -->
      <div class="table-wrapper">
        <table class="tabel">
          <tr>
            <td colspan="2" class="judul">INPUT</td>
          </tr>

          <tr><td class="left-text">Start</td><td id="startTabel" class="center-text">0</td></tr>
          <tr><td class="left-text">Stop</td><td id="stopTabel" class="center-text">0</td></tr>
          <tr><td class="left-text">-</td><td class="center-text">-</td></tr>
          <tr><td class="left-text">-</td><td class="center-text">-</td></tr>
          <tr><td class="left-text">-</td><td class="center-text">-</td></tr>
          <tr><td class="left-text">-</td><td class="center-text">-</td></tr>
          <tr><td class="left-text">-</td><td class="center-text">-</td></tr>
          <tr><td class="left-text">-</td><td class="center-text">-</td></tr>
          <tr><td class="left-text">-</td><td class="center-text">-</td></tr>
          <tr><td class="left-text">-</td><td class="center-text">-</td></tr>
        </table>
      </div>

      <!-- output -->
      <div class="table-wrapper">
        <table class="tabel">
          <tr>
            <td colspan="2" class="judul">OUTPUT</td>
          </tr>

          <tr><td class="left-text">Lampu</td><td id="lampuTabel" class="center-text">0</td></tr>
          <tr><td class="left-text">-</td><td class="center-text">-</td></tr>
          <tr><td class="left-text">-</td><td class="center-text">-</td></tr>
          <tr><td class="left-text">-</td><td class="center-text">-</td></tr>
          <tr><td class="left-text">-</td><td class="center-text">-</td></tr>
          <tr><td class="left-text">-</td><td class="center-text">-</td></tr>
          <tr><td class="left-text">-</td><td class="center-text">-</td></tr>
          <tr><td class="left-text">-</td><td class="center-text">-</td></tr>
          <tr><td class="left-text">-</td><td class="center-text">-</td></tr>
          <tr><td class="left-text">-</td><td class="center-text">-</td></tr>
        </table>
      </div>

    </div>
  </div>

</div>

<script>
  const button1 = document.querySelector('.button1');
  const button2 = document.querySelector('.button2');
  const startTabel = document.getElementById('startTabel');
  const stopTabel = document.getElementById('stopTabel');
  const lamp = document.querySelector('.lamp');
  const lampuTabel = document.getElementById('lampuTabel');
  
  let memori = "0";
  
  // tracking pointer
  let activePointers = {
    start: null,
    stop: null
  };
  
  function updateValue() {
  
    // tombol style
    if (startTabel.textContent.trim() === "1") {
      button1.style.background = "limegreen";
      button1.style.boxShadow = "0px 0px 10px limegreen";
    } else {
      button1.style.background = "#666";
      button1.style.boxShadow = "0px 10px 10px #333";
    }
  
    if (stopTabel.textContent.trim() === "1") {
      button2.style.background = "limegreen";
      button2.style.boxShadow = "0px 0px 10px limegreen";
    } else {
      button2.style.background = "#666";
      button2.style.boxShadow = "0px 10px 10px #333";
    }
  
    // logika
    if (startTabel.textContent.trim() === "1") {
      memori = "1";
    } else if (stopTabel.textContent.trim() === "1") {
      memori = "0";
    }
  
    lampuTabel.textContent = memori;
  
    if (memori === "1") {
      lamp.style.background = "limegreen";
      lamp.style.boxShadow = "0px 0px 10px limegreen";
    } else {
      lamp.style.background = "#666";
      lamp.style.boxShadow = "0px 0px 10px #333";
    }
  }
  
  // tombol start konfig
  button1.addEventListener('pointerdown', (e) => {
    activePointers.start = e.pointerId;
    startTabel.textContent = "1";
    updateValue();
  });
  
  button1.addEventListener('pointerup', (e) => {
    if (e.pointerId === activePointers.start) {
      activePointers.start = null;
      startTabel.textContent = "0";
      updateValue();
    }
  });
  
  // tombol stop konfig
  button2.addEventListener('pointerdown', (e) => {
    activePointers.stop = e.pointerId;
    stopTabel.textContent = "1";
    updateValue();
  });
  
  button2.addEventListener('pointerup', (e) => {
    if (e.pointerId === activePointers.stop) {
      activePointers.stop = null;
      stopTabel.textContent = "0";
      updateValue();
    }
  });
  
  // tidak keluar area
  document.addEventListener('pointerup', (e) => {
  
    // tombol start
    if (e.pointerId === activePointers.start) {
      activePointers.start = null;
      startTabel.textContent = "0";
    }
  
    // tombol stop
    if (e.pointerId === activePointers.stop) {
      activePointers.stop = null;
      stopTabel.textContent = "0";
    }
  
    updateValue();
  });
  
  updateValue();
</script>

</body>
</html>
