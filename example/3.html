<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PLC Edge Logic</title>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: #222;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
}

.wrapper {
  width: 1280px;
  height: 720px;
}

.frame {
  width: 100%;
  height: 100%;
  padding: 20px;
  background: repeating-linear-gradient(
    45deg,
    #000 0px,
    #000 15px,
    #ffcc00 15px,
    #ffcc00 30px
  );
  display: flex;
}

.container {
  width: 100%;
  height: 100%;
  background: #333;
  border-radius: 12px;
  display: flex;
  overflow: hidden;
  color: white;
}

.left {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: center;
  padding: 20px;
}

.button-group {
  display: flex;
  gap: 20px;
}

button {
  width: 180px;
  height: 70px;
  font-size: 18px;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  background: #555;
}

button.active {
  background: limegreen;
}

.right {
  width: 300px;
  background: #222;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 15px;
}

.lamp-area {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}

.lamp {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  background: #666;
}

.lamp.on {
  background: limegreen;
  box-shadow: 0 0 20px limegreen;
}

table {
  width: 100%;
  border-collapse: collapse;
}

td {
  border: 1px solid #555;
  padding: 10px;
}
</style>
</head>

<body>

<div class="wrapper">
  <div class="frame">
    <div class="container">

      <div class="left">

        <div class="lamp-area">
          <div class="lamp" id="lamp"></div>
          <div>Lampu</div>
        </div>

        <div class="button-group">
          <button id="btnStart">START</button>
          <button id="btnStop">STOP</button>
        </div>

      </div>

      <div class="right">
        <table>
          <tr>
            <td>START</td>
            <td id="valStart">0</td>
          </tr>
          <tr>
            <td>STOP</td>
            <td id="valStop">0</td>
          </tr>
          <tr>
            <td>LAMP</td>
            <td id="valLamp">0</td>
          </tr>
        </table>
      </div>

    </div>
  </div>
</div>

<script>
const btnStart = document.getElementById("btnStart");
const btnStop = document.getElementById("btnStop");

const valStart = document.getElementById("valStart");
const valStop = document.getElementById("valStop");
const valLamp = document.getElementById("valLamp");

const lamp = document.getElementById("lamp");

/* STATE */
let lampState = 0;
let prevStart = 0;

/* INPUT SET */
function setStart(v) {
  valStart.textContent = v;
  btnStart.classList.toggle("active", v === 1);
}

function setStop(v) {
  valStop.textContent = v;
  btnStop.classList.toggle("active", v === 1);
}

/* LOGIC */
function logic() {
  const start = parseInt(valStart.textContent);
  const stop = parseInt(valStop.textContent);

  // 🔥 Edge detection: START dilepas saat STOP masih aktif
  if (prevStart === 1 && start === 0 && stop === 1) {
    lampState = 0;
  }
  else if (start === 1) {
    lampState = 1;
  }
  else if (stop === 1) {
    lampState = 0;
  }

  prevStart = start;

  valLamp.textContent = lampState;
  lamp.classList.toggle("on", lampState === 1);
}

/* EVENTS */
btnStart.addEventListener("mousedown", () => {
  setStart(1);
  logic();
});

btnStart.addEventListener("mouseup", () => {
  setStart(0);
  logic();
});

btnStop.addEventListener("mousedown", () => {
  setStop(1);
  logic();
});

btnStop.addEventListener("mouseup", () => {
  setStop(0);
  logic();
});

/* TOUCH */
btnStart.addEventListener("touchstart", (e) => {
  e.preventDefault();
  setStart(1);
  logic();
});

btnStart.addEventListener("touchend", () => {
  setStart(0);
  logic();
});

btnStop.addEventListener("touchstart", (e) => {
  e.preventDefault();
  setStop(1);
  logic();
});

btnStop.addEventListener("touchend", () => {
  setStop(0);
  logic();
});
</script>

<script>
function scalePanel() {
  const scale = Math.min(
    window.innerWidth / 1280,
    window.innerHeight / 720
  );
  document.body.style.transform = `scale(${scale})`;
}

window.addEventListener("resize", scalePanel);
window.addEventListener("load", scalePanel);
</script>

</body>
</html>
