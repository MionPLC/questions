<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Responsive Panel</title>

<style>
html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: #222;
  font-family: Arial, sans-serif;
}

/* viewport untuk scaling */
.viewport {
  width: 100vw;
  height: 100vh;
  position: relative;
}

/* wrapper yang di-scale */
.scale-wrapper {
  position: absolute;
  top: 50%;
  left: 50%;
  transform-origin: center;
}

/* BORDER WARNING */
.frame {
  padding: 20px;
  border-radius: 16px;
  background: repeating-linear-gradient(
    45deg,
    #000 0px,
    #000 15px,
    #ffcc00 15px,
    #ffcc00 30px
  );
}

/* PANEL UTAMA */
.container {
  width: 500px;
  height: 260px;
  background: #333;
  border-radius: 12px;
  display: flex;
  overflow: hidden;
  color: white;
}

/* kiri */
.left {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: center;
  padding: 15px;
}

/* kanan (tabel) */
.right {
  width: 180px;
  background: #222;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 10px;
}

/* lamp */
.lamp-area {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}

.lamp {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background: #666;
  box-shadow: inset 0 0 10px #000;
}

.lamp.on {
  background: limegreen;
  box-shadow: 0 0 15px limegreen, inset 0 0 10px #000;
}

/* button */
button {
  width: 140px;
  height: 60px;
  font-size: 16px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  background: #555;
}

button:active {
  background: limegreen;
}

/* tabel */
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}

td {
  border: 1px solid #555;
  padding: 6px;
  word-break: break-word;
}
</style>
</head>

<body>

<div class="viewport">
  <div class="scale-wrapper" id="scaleWrapper">

    <div class="frame">
      <div class="container">

        <!-- LEFT -->
        <div class="left">

          <div class="lamp-area">
            <div class="lamp" id="lamp"></div>
            <div>Lampu</div>
          </div>

          <button id="btn">Tombol</button>

        </div>

        <!-- RIGHT -->
        <div class="right">
          <table>
            <tr>
              <td>Button Value</td>
              <td id="valBtn">0</td>
            </tr>
            <tr>
              <td>Lamp Value</td>
              <td id="valLamp">0</td>
            </tr>
          </table>
        </div>

      </div>
    </div>

  </div>
</div>

<script>
// ==========================
// SCALE SYSTEM (RESPONSIVE)
// ==========================
function scaleUI() {
  const baseWidth = 500 + 40;   // container + frame padding
  const baseHeight = 260 + 40;

  const scaleX = window.innerWidth / baseWidth;
  const scaleY = window.innerHeight / baseHeight;

  const scale = Math.min(scaleX, scaleY);

  const wrapper = document.getElementById("scaleWrapper");

  wrapper.style.transform = `translate(-50%, -50%) scale(${scale})`;
}

window.addEventListener("resize", scaleUI);
window.addEventListener("load", scaleUI);

// ==========================
// LOGIC BUTTON + LAMP
// ==========================
const btn = document.getElementById("btn");
const lamp = document.getElementById("lamp");
const valBtn = document.getElementById("valBtn");
const valLamp = document.getElementById("valLamp");

btn.addEventListener("mousedown", () => {
  valBtn.textContent = "1";
  lamp.classList.add("on");
  valLamp.textContent = "1";
});

btn.addEventListener("mouseup", () => {
  valBtn.textContent = "0";
  lamp.classList.remove("on");
  valLamp.textContent = "0";
});

// support mobile (touch)
btn.addEventListener("touchstart", () => {
  valBtn.textContent = "1";
  lamp.classList.add("on");
  valLamp.textContent = "1";
});

btn.addEventListener("touchend", () => {
  valBtn.textContent = "0";
  lamp.classList.remove("on");
  valLamp.textContent = "0";
});
</script>

</body>
</html>
